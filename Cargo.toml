[package]
name = "urlrouter"
version = "1.2.0"
edition = "2021"
description = "Tiny Windows and macOS default-browser shim that forwards each link to a real browser (or the Slack app) chosen by URL rules"
publish = false

# Deliberately no [dependencies]: the Win32 calls are declared by hand in
# src/win.rs so the build is offline-reproducible and the .exe needs nothing
# beyond DLLs that ship with every Windows install.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
